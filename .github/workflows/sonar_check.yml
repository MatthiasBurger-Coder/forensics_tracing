name: sonar_check.yml
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Gradle (caching + env)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable (Linux)
        run: chmod +x ./gradlew

      - name: Build & Test
        run: ./gradlew build jacocoTestReport

      - name: SonarCloud
        uses: SonarSource/sonarcloud-github-action@4006f663ecaf1f8093e8e4abb9227f6041f52216
        env:
           SONAR_TOKEN: ${{ secrets.SONAR_CLOUD_TOKEN }}
           args: >
             -Dsonar.organization=matthiasburger-coder
             -Dsonar.projectKey=MatthiasBurger-Coder_forensics_tracing
             -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
             -Dsonar.scanner.force-deprecated-java-version-fallback=true



