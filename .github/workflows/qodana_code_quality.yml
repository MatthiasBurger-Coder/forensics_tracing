#-------------------------------------------------------------------------------#
#        Discover additional configuration options in our documentation         #
#               https://www.jetbrains.com/help/qodana/github.html               #
#-------------------------------------------------------------------------------#

name: Qodana Code Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: # Specify your branches here
      - main # The 'main' branch
      - 'releases/*' # The release branches

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read              # required for checkout
      security-events: write      # REQUIRED for upload-sarif
      checks: write               # (optional) annotations in PR checks
      pull-requests: write        # (optional) PR UI niceties

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix gradlew permissions and line endings
        run: |
          if [ -f gradlew ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
          else
            echo "gradlew not found in repo root" && exit 1
          fi

      - name: Run tests with coverage (JaCoCo)
        run: ./gradlew --no-daemon clean test jacocoTestReport

      - name: Prepare Qodana coverage folder
        run: |
          mkdir -p .qodana/code-coverage
          # Ensure the XML exists (fail fast if missing)
          test -f build/reports/jacoco/test/jacocoTestReport.xml
          cp build/reports/jacoco/test/jacocoTestReport.xml .qodana/code-coverage/

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2025.1
        with:
          pr-mode: false
          use-caches: true
          upload-result: true
          args: --config,qodana.yaml
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1815737186 }}
          QODANA_ENDPOINT: https://qodana.cloud

