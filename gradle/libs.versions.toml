[versions]
junit    = "5.13.4"
archunit = "1.4.1"
junit-platform = "1.11.3"
assertj  = "3.27.6"
javaparser = "3.27.0"
aspectj  = "1.9.24"
bytebuddy = "1.14.12"
slf4j    = "2.0.17"
logback  = "1.5.18"
mockito = "5.13.0"
byteman = "4.0.23"

# Gradle plugins
#gradle-plugin-publish = "2.0.0"
#nexus-publish         = "2.0.0"

[plugins]
#gradle-plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "gradle-plugin-publish" }
#nexus-publish         = { id = "io.github.gradle-nexus.publish-plugin", version.ref = "nexus-publish" }

[libraries]

# JavaParser
javaparser-symbol-solver-core = { module = "com.github.javaparser:javaparser-symbol-solver-core", version.ref = "javaparser" }

# AspectJ
aspectj-rt     = { module = "org.aspectj:aspectjrt",     version.ref = "aspectj" }
aspectj-weaver = { module = "org.aspectj:aspectjweaver", version.ref = "aspectj" }

# Logging
slf4j-api       = { module = "org.slf4j:slf4j-api",        version.ref = "slf4j" }
slf4j-simple    = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
jul-to-slf4j    = { module = "org.slf4j:jul-to-slf4j",     version.ref = "slf4j" }
jcl-over-slf4j  = { module = "org.slf4j:jcl-over-slf4j",   version.ref = "slf4j" }

# Testing (JUnit 5 via BOM + Jupiter)
# BOM
junit-bom               = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter           = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api       = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine    = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
archunit-junit          = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit"}

# BOM liefert die Versionen für alle Mockito-Module
mockito-bom           = { module = "org.mockito:mockito-bom", version.ref = "mockito" }
mockito-core          = { module = "org.mockito:mockito-core" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter" }
mockito-inline        = { module = "org.mockito:mockito-inline" }

# ByteBuddy agent
byte-buddy-agent = { module = "net.bytebuddy:byte-buddy-agent", version.ref = "bytebuddy" }

# Assertions
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
byteman = { module = "org.jboss.byteman:byteman", version.ref = "byteman" }
